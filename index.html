<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FiveM Codes | أكواد فايف إم</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#0a0a0d;color:#eee;min-height:100vh}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% -10%,#30303a 0,#0a0a0d 42%);pointer-events:none}
.container{position:relative;max-width:1100px;margin:auto;padding:45px 20px 60px}
.hero{text-align:center;padding:25px 10px 35px}
.logo{display:inline-flex;width:70px;height:70px;border-radius:20px;align-items:center;justify-content:center;background:#fff;color:#08080a;font-size:28px;font-weight:900;box-shadow:0 10px 40px #000}
h1{font-size:42px;margin:18px 0 8px} .hero p{color:#999;font-size:16px;margin:0}
.search{margin:10px auto 30px;max-width:700px;display:flex;background:#15151b;border:1px solid #292932;border-radius:14px;padding:5px}
.search input{flex:1;background:none;border:0;outline:0;color:#fff;padding:14px;font-size:16px}
.search span{padding:13px;color:#777}
.section{margin-top:28px}.section-title{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.section-title h2{font-size:20px;margin:0}.count{font-size:12px;color:#999;background:#17171d;padding:5px 9px;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:#121218;border:1px solid #25252e;border-radius:14px;padding:16px;transition:.2s}
.card:hover{border-color:#555;transform:translateY(-2px)}
.desc{color:#a7a7af;font-size:13px;margin-bottom:12px}
.code-row{display:flex;align-items:center;gap:9px;background:#09090c;border:1px solid #202027;border-radius:10px;padding:10px}
code{font-family:Consolas,monospace;font-size:14px;color:#f2f2f2;direction:ltr;text-align:left;flex:1;overflow:auto;white-space:nowrap}
button{border:0;border-radius:8px;background:#eee;color:#09090c;font-weight:700;padding:8px 11px;cursor:pointer}
button:hover{background:#fff}.copied{background:#72e6a0}
.footer{text-align:center;color:#666;margin-top:45px;font-size:12px}
@media(max-width:600px){h1{font-size:31px}.container{padding:25px 13px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<header class="hero">
<div class="logo">F5</div>
<h1>FiveM Codes</h1>
<p>مكتبة أكواد فايف إم مرتبة وسهلة النسخ</p>
</header>

<div class="search"><span>⌕</span><input id="search" placeholder="ابحث عن كود أو وصف..."></div>
<div id="app"></div>
<div class="footer">صنع بواسطة <strong style="color:#fff">GUTS</strong> • FiveM Codes</div>
</div>

<script>
const sections=[
["الأكواد الأساسية",[
["حذف أي اختصار","unbind keyboard -","حذف أي اختصار"],
["إعطاء نقود","bind keyboard - RTTTT","اختصار إعطاء نقود"],
["الكلبشة","bind keyboard - SHandCuff","اختصار الكلبشة"],
["السحب","bind keyboard - Sdrag","اختصار السحب"],
["الدرع","bind keyboard - MK3Dr3","اختصار الدرع"],
["حذف المركبات","bind keyboard - dv","اختصار حذف المركبات"],
["إنعاش محيط","bind keyboard - eheal5s1","اختصار إنعاش محيط"],
["الأكل والشرب","bind keyboard - fooddrink","اختصار الأكل والشرب"],
["إنعاش عن بعد","bind keyboard - rreevvv","اختصار إنعاش عن بعد"],
["الذهاب إلى نقطة","bind keyboard - waypointttt","اختصار الذهاب إلى نقطة"],
["الحمل","bind keyboard - carry","اختصار الحمل"]
]],
["الاختصارات العسكرية",[
["الثبات",'bind keyboard - "e airforce02"',"اختصار الثبات"],
["الراحة من الاستعداد",'bind keyboard - "e airforce03"',"اختصار الراحة من الاستعداد"],
["الاستعداد",'bind keyboard - "e airforce04"',"اختصار الاستعداد"],
["بشب",'bind keyboard - "e pushup"',"اختصار بشب"]
]],
["اختصارات الحركات الأكثر طلبًا",[
["الدخان",'bind keyboard - "e smoke"',"اختصار الدخان"],
["الحضن",'bind keyboard - "e hug"',"اختصار الحضن"],
["الكف",'bind keyboard - "e slap"',"اختصار الكف"],
["بوسة",'bind keyboard - "e blowkiss2"',"اختصار بوسة"],
["الجلوس",'bind keyboard - "e meditate"',"اختصار الجلوس"]
]]
];

const app=document.getElementById("app"), search=document.getElementById("search");
function render(q=""){
 app.innerHTML="";
 let total=0;
 sections.forEach(([title,items])=>{
   const filtered=items.filter(([name,code,desc])=>(name+" "+code+" "+desc).toLowerCase().includes(q.toLowerCase()));
   if(!filtered.length)return;
   total+=filtered.length;
   const sec=document.createElement("section");sec.className="section";
   sec.innerHTML=`<div class="section-title"><h2>${title}</h2><span class="count">${filtered.length}</span></div>`;
   const grid=document.createElement("div");grid.className="grid";
   filtered.forEach(([name,code,desc])=>{
     const card=document.createElement("article");card.className="card";
     card.innerHTML=`<div class="desc"><strong>${name}</strong><br>${desc}</div>
     <div class="code-row"><code>${code.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}</code><button>نسخ</button></div>`;
     const btn=card.querySelector("button");
     btn.onclick=async()=>{await navigator.clipboard.writeText(code);btn.textContent="تم النسخ ✓";btn.classList.add("copied");setTimeout(()=>{btn.textContent="نسخ";btn.classList.remove("copied")},1200)};
     grid.appendChild(card);
   });
   sec.appendChild(grid);app.appendChild(sec);
 });
 if(!total) app.innerHTML='<div style="text-align:center;color:#777;padding:50px">ما لقيت الكود اللي بتدور عليه.</div>';
}
search.addEventListener("input",e=>render(e.target.value));render();
</script>
</body>
</html>
